<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="900" viewBox="0 0 1520 900" role="img" aria-labelledby="fan-title fan-desc" id="fan-flow">
<style>:root{--foreground:#1f2937;--background:#fff;--border:#cbd5e1;--blue:#2563eb;--orange:#b45309;--muted-foreground:#64748b;--control-fill:#eff6ff;--human-fill:#fff7ed} @media(prefers-color-scheme:dark){:root{--foreground:#e5e7eb;--background:#111827;--border:#475569;--blue:#60a5fa;--orange:#fb923c;--muted-foreground:#cbd5e1;--control-fill:#182946;--human-fill:#38281d}}
#fan-flow{color:var(--foreground);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;max-width:1600px;margin:auto}#fan-flow{display:block;max-width:100%;height:auto}#fan-flow text{fill:var(--foreground);font-size:19px}#fan-flow .heading{font-size:27px;font-weight:500}#fan-flow .name{font-size:21px;font-weight:500}#fan-flow .small{font-size:16px}#fan-flow .node{fill:var(--background);stroke:var(--border);stroke-width:1.5}#fan-flow .control{fill:var(--control-fill);stroke:var(--blue);stroke-width:1.5}#fan-flow .human{fill:var(--human-fill);stroke:var(--orange);stroke-width:1.5}#fan-flow .quiet{fill:var(--background)}#fan-flow .normal{fill:none;stroke:var(--muted-foreground);stroke-width:1.6;marker-end:url(#fan-normal)}#fan-flow .back{fill:none;stroke:var(--blue);stroke-width:1.8;marker-end:url(#fan-back)}#fan-flow .inferred{stroke-dasharray:6 5}#fan-flow .sources{text-align:right}
</style><title id="fan-title">Development workflow and feedback loops</title><desc id="fan-desc">Each development stage 01–07 appears once. Stage delivery failures report the stage, issue and evidence to the Main Agent. The Main Agent routes work by cause, impact and authorization. Incorrect requirements or acceptance criteria require correction of product documents and user confirmation before development Clarify repeats. Code or test defects return to Implement, followed by affected verification and independent re-review. Gray arrows show normal progress and blue arrows show feedback. The diagram shows common routes, not an exhaustive state machine; Submit follows its own stage rules.</desc>
<rect width="1520" height="900" fill="var(--background)" />
<defs><marker id="fan-normal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="var(--muted-foreground)" stroke-width="1.3" /></marker><marker id="fan-back" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="var(--blue)" stroke-width="1.3" /></marker></defs>
<text x="20" y="35" class="heading">Development workflow and feedback loops</text><text x="20" y="73" class="small">Main Agent: the AI in your current conversation. Delegated agents follow their assigned roles.</text>
<path d="M1110 30H1150" class="normal" /><text x="1162" y="36" class="small">Progress</text><path d="M1260 30H1300" class="back" /><text x="1312" y="36" class="small">Rework</text>


<path id="node-route" d="M750 105L930 175L750 245L570 175Z" class="control" />
<text x="750" y="166" text-anchor="middle" class="name">③ Assess cause &amp; impact</text><text x="750" y="194" text-anchor="middle" class="small">Main Agent delegates by stage</text>
<path data-from="route" data-to="user" d="M930 175H1110" class="back" /><text x="1020" y="141" text-anchor="middle" class="small" style="font-size:15px">Scope / dispute<tspan x="1020" dy="20">or exception</tspan></text><rect id="node-user" x="1110" y="125" width="270" height="85" rx="8" class="human" /><text x="1245" y="157" text-anchor="middle" class="name">User decision</text><text x="1245" y="186" text-anchor="middle" class="small">Explain impact; await decision</text>
<path data-from="user" data-to="route" d="M1245 210V260H860V202" class="back" /><text x="1050" y="251" text-anchor="middle" class="small">Delegate after the decision</text>

<path data-from="route" data-to="product" d="M750 245C750 280 225 270 225 290V365" class="back" />
<path data-from="route" data-to="02" d="M750 245C750 280 415 270 415 290V480" class="back" />
<path data-from="route" data-to="03" d="M750 245C750 280 605 270 605 290V480" class="back" />
<path data-from="route" data-to="04" d="M750 245C750 280 795 270 795 290V480" class="back" />
<path data-from="route" data-to="05" d="M750 245C750 280 985 270 985 290V480" class="back" />
<path data-from="route" data-to="06" d="M750 245C750 280 1175 270 1175 290V480" class="back" />
<path data-from="route" data-to="07" d="M750 245C750 280 1365 270 1365 290V480" class="back" />
<rect x="140" y="300" width="170" height="44" class="quiet" /><text x="225" y="315" text-anchor="middle" class="small" style="font-size:15px">Requirements / AC<tspan x="225" dy="22">need correction</tspan></text><rect x="330" y="300" width="170" height="44" class="quiet" /><text x="415" y="315" text-anchor="middle" class="small">Design / test cases</text><text x="415" y="337" text-anchor="middle" class="small">or Plan unapproved</text>
<rect x="520" y="300" width="170" height="44" class="quiet" /><text x="605" y="326" text-anchor="middle" class="small">Code / test defects</text>
<rect x="710" y="300" width="170" height="44" class="quiet" /><text x="795" y="315" text-anchor="middle" class="small" style="font-size:15px">Missing / stale<tspan x="795" dy="22">evidence</tspan></text><rect x="900" y="300" width="170" height="44" class="quiet" /><text x="985" y="315" text-anchor="middle" class="small" style="font-size:15px">Incorrect / missing<tspan x="985" dy="22">documentation</tspan></text><rect x="1090" y="297" width="170" height="58" class="quiet" /><text x="1175" y="320" text-anchor="middle" class="small">Review, acceptance</text><text x="1175" y="344" text-anchor="middle" class="small">or approval pending</text>
<rect x="1280" y="300" width="170" height="44" class="quiet" /><text x="1365" y="315" text-anchor="middle" class="small" style="font-size:15px">Submission<tspan x="1365" dy="22">operation failed</tspan></text><rect id="node-product" x="150" y="365" width="150" height="60" rx="7" class="human" /><text x="225" y="391" text-anchor="middle" class="small">Fix product docs</text><text x="225" y="414" text-anchor="middle" class="small">User confirms</text><path data-from="product" data-to="01" d="M225 425V480" class="back" />

<text x="20" y="459" class="name">① Normal progress</text>
<ellipse id="node-start" cx="65" cy="525" rx="45" ry="25" class="node" /><text x="65" y="531" text-anchor="middle">Start</text><path data-from="start" data-to="01" d="M110 525H150" class="normal" />
<rect id="node-01" x="150" y="480" width="150" height="90" rx="7" class="node" /><text x="225" y="511" text-anchor="middle" class="name">01 Clarify</text><text x="225" y="540" text-anchor="middle" class="small">Main Agent · check</text><path data-from="01" data-to="02" d="M300 525H340" class="normal" />
<rect id="node-02" x="340" y="480" width="150" height="90" rx="7" class="node" /><text x="415" y="508" text-anchor="middle" class="name">02 Plan</text><text x="415" y="534" text-anchor="middle" class="small">Main Agent</text><text x="415" y="558" text-anchor="middle" class="small" style="font-size:14px">User approval first</text><path data-from="02" data-to="03" d="M490 525H530" class="normal" />
<rect id="node-03" x="530" y="480" width="150" height="90" rx="7" class="node" /><text x="605" y="511" text-anchor="middle" class="name">03 Implement</text><text x="605" y="540" text-anchor="middle" class="small">Coder</text><path data-from="03" data-to="04" d="M680 525H720" class="normal" />
<rect id="node-04" x="720" y="480" width="150" height="90" rx="7" class="node" /><text x="795" y="511" text-anchor="middle" class="name">04 Verify</text><text x="795" y="540" text-anchor="middle" class="small">Verifier</text><path data-from="04" data-to="05" d="M870 525H910" class="normal" />
<rect id="node-05" x="910" y="480" width="150" height="90" rx="7" class="node" /><text x="985" y="511" text-anchor="middle" class="name">05 Docs</text><text x="985" y="540" text-anchor="middle" class="small">Executor</text><path data-from="05" data-to="06" d="M1060 525H1100" class="normal" />
<rect id="node-06" x="1100" y="480" width="150" height="90" rx="7" class="node" /><text x="1175" y="508" text-anchor="middle" class="name">06 Review</text><text x="1175" y="534" text-anchor="middle" class="small">Reviewer</text><text x="1175" y="550" text-anchor="middle" class="small" style="font-size:13.5px">User acceptance<tspan x="1175" dy="16">and submit approval</tspan></text><path data-from="06" data-to="07" d="M1250 525H1290" class="normal" />
<rect id="node-07" x="1290" y="480" width="150" height="90" rx="7" class="node" /><text x="1365" y="511" text-anchor="middle" class="name">07 Submit</text><text x="1365" y="540" text-anchor="middle" class="small">Executor</text><path data-from="07" data-to="end" d="M1440 525H1462" class="normal" /><ellipse id="node-end" cx="1490" cy="525" rx="28" ry="25" class="node" /><text x="1490" y="531" text-anchor="middle" class="small">Done</text>


<path data-from="01" data-to="report" d="M225 570C225 640 620 640 620 720" class="back" />
<path data-from="02" data-to="report" d="M415 570C415 640 660 640 660 720" class="back" />
<path data-from="03" data-to="report" d="M605 570C605 640 700 640 700 720" class="back" />
<path data-from="04" data-to="report" d="M795 570C795 640 750 640 750 720" class="back" />
<path data-from="05" data-to="report" d="M985 570C985 640 800 640 800 720" class="back" />
<path data-from="06" data-to="report" d="M1175 570C1175 640 840 640 840 720" class="back" />
<path data-from="07" data-to="report" d="M1365 570C1365 640 880 640 880 720" class="back" />
<rect id="node-report" x="600" y="720" width="300" height="90" rx="8" class="control" /><text x="750" y="749" text-anchor="middle" class="name">② Report the stage issue</text><text x="750" y="777" text-anchor="middle">Stage + issue + evidence</text><text x="750" y="800" text-anchor="middle" class="small">Main Agent checks</text>
<path data-from="report" data-to="route" d="M600 765H30Q10 765 10 745V195Q10 175 30 175H570" class="back" />
<text x="20" y="858" class="small">② Report failed stage deliveries or blockers needing coordination. Expected TDD Red and local fixes stay in their stage.</text><text x="20" y="887" class="small">Common routes: resolve issues in dependency order; recheck affected parts, then independently re-review. Submit follows its stage rules.</text>
</svg>