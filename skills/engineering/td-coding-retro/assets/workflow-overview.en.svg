<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="180" viewBox="0 0 1260 180" role="img" aria-labelledby="title desc">
<title id="title">Retrospective and improvement workflow</title>
<desc id="desc">An agent reviews the session and reports findings. You select improvements. An independent agent verifies the changes. You inspect Git Diff and authorize any submission.</desc>
<style>svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:white}text{fill:#253347}.name{font-size:21px;font-weight:650}.small{font-size:14.5px;fill:#66758a}.number{font-size:17px;font-weight:500;fill:#66758a}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs>
<rect width="1260" height="180" fill="white"/>
<rect x="24" y="26" width="270" height="122" rx="9" fill="#eff6ff" stroke="#93b4f6" stroke-width="1.4"/>
<text x="159" y="78" class="name" text-anchor="middle"><tspan class="number">01</tspan><tspan dx="9">Review the session</tspan></text>
<text x="159" y="112" class="small" text-anchor="middle">Produce an improvement report</text>
<path d="M294 87H338" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="338" y="26" width="270" height="122" rx="9" fill="#fff7ed" stroke="#e5a35c" stroke-width="1.4"/>
<text x="473" y="78" class="name" text-anchor="middle"><tspan class="number">02</tspan><tspan dx="9">You select changes</tspan></text>
<text x="473" y="112" class="small" text-anchor="middle">Choose report item numbers</text>
<path d="M608 87H652" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="652" y="26" width="270" height="122" rx="9" fill="#eff6ff" stroke="#93b4f6" stroke-width="1.4"/>
<text x="787" y="78" class="name" text-anchor="middle"><tspan class="number">03</tspan><tspan dx="9">Implement &amp; verify</tspan></text>
<text x="787" y="112" class="small" text-anchor="middle">Independent agent · keep or roll back</text>
<path d="M922 87H966" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="966" y="26" width="270" height="122" rx="9" fill="#fff7ed" stroke="#e5a35c" stroke-width="1.4"/>
<text x="1101" y="78" class="name" text-anchor="middle"><tspan class="number">04</tspan><tspan dx="9">You review changes</tspan></text>
<text x="1101" y="112" class="small" text-anchor="middle">Git Diff · submit when authorized</text>
</svg>
